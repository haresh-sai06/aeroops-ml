name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests scripts dashboard
      - run: pytest -q
        env:
          PYTHONPATH: src
          AEROOPS_SPARK_CORES: "2"
  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      # CI has no trained artifacts; build the image with an empty models dir to validate the Dockerfile.
      - run: mkdir -p models && docker build -t aeroops-api:ci .
